name: Build/Publish to TEST environment
on:
  push:
    branches:
      - dev

env:
  PYTHON_VERSION: 3.12
  # ???_VERSION: 

jobs:
  resume:
    name: Generate Resume
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f resume/requirements.txt ]; then pip install -r resume/requirements.txt; fi

      - name: Generate CV Template
        run: python resume/convert_to_cv.py --source config.yml --template resume/template.yml --destination resume/generated.yml

      - name: Build Resume
        run: rendercv render resume/generated.yml --pdf-path resume/resume.pdf

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume
          path: resume/resume.pdf

  # site:
