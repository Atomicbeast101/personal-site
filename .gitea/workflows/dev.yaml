name: Build/Publish to TEST environment
on:
  push:
    branches:
      - dev

env:
  PYTHON_VERSION: 3.12
  NODE_VERSION: 26.9.0

jobs:
  resume:
    name: Generate Resume
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f resume/requirements.txt ]; then pip install -r resume/requirements.txt; fi

      - name: Generate CV Template
        run: python resume/convert_to_cv.py --source config.yml --template resume/template.yml --destination resume/generated.yml

      - name: Build Resume
        run: rendercv render resume/generated.yml --pdf-path resume.pdf

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: resume
          path: ./resume/resume.pdf

  site:
    name: Generate Site
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Generate Authors for Blog
        run: python site/generate_authors.py --source config.yml --destination site/blog/authors.yml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # - name: Cache Dependencies
      #   uses: actions/cache@v5
      #   with:
      #     path: ./site/.npm
      #     key: ${{ runner.os }}-node-${{ hashFiles('./site/package-lock.json') }}
      #     restore-keys: ${{ runner.os }}-node-

      # - name: Build Site
      #   run: |
      #     npm ci
      #     npm run build

      # - name: Upload Artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: site
      #     path: ./site/build

  publish:
    name: Publish
    needs:
      - resume
      - site
    steps:
      - name: Download Resume Artifact
        uses: actions/download-artifact@v3
        with:
          name: resume
          path: ./resume

      # Upload resume.pdf to Github pages

      # - name: Download Site Artifact
      #   uses: actions/download-artifact@v3
      #   with:
      #     name: site
      #     path: ./site/public

      # Upload site files to Github pages

  report:
    name: Report
    if: always()
    continue-on-error: true
    needs:
      - publish
    env:
      SUCCESS: ${{ needs.publish.result == 'success' }}
    steps:
      - name: Notify User
        uses: https://${{ vars.LOCAL_REGISTRY_URL }}/${{ vars.LOCAL_REGISTRY_USERNAME }}/gitea-workflows-notification@main
        with:
          success: ${{ env.SUCCESS }}
          pushover_user: ${{ secrets.PUSHOVER_USER }}
          pushover_token: ${{ secrets.PUSHOVER_TOKEN }}
