name: Build/Publish to TEST environment
on:
  push:
    branches:
      - dev

env:
  PYTHON_VERSION: 3.12
  HUGO_VERSION: 0.167.0

jobs:
  resume:
    name: Generate Resume
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f resume/requirements.txt ]; then pip install -r resume/requirements.txt; fi

      - name: Generate CV Template
        run: python resume/convert_to_cv.py --source config.yml --template resume/template.yml --destination resume/generated.yml

      - name: Build Resume
        run: rendercv render resume/generated.yml --pdf-path resume.pdf

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: resume
          path: ./resume/resume.pdf

  site:
    name: Generate Site
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f site/requirements.txt ]; then pip install -r site/requirements.txt; fi
      
      - name: Create Missing Directory
        run: mkdir -p site/data/en

      - name: Generate Content
        run: python site/generate_content.py --source config.yml --destination site/data/en

      - name: Build Site
        uses: jakejarvis/hugo-build-action@master
        with:
          args: --configDir site --minify --buildDrafts

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: site
          path: ./public

  publish:
    name: Publish
    needs:
      - resume
      - site
    steps:
      # - name: Setup Python
      #   uses: actions/setup-python@v7
      #   with:
      #     python-version: ${{ env.PYTHON_VERSION }}

      # - name: Create Python Virtual Environment
      #   run: |
      #     python -m venv .venv
      #     source .venv/bin/activate
      #     echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
      #     echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Download Site Artifact
        uses: actions/download-artifact@v3
        with:
          name: site
          path: ./

      - name: Download Resume Artifact
        uses: actions/download-artifact@v3
        with:
          name: resume
          path: ./

      - name: Debug
        run: ls ./

      - name: Upload to SFTP Server
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ vars.SFTP_HOST }}
          username: ${{ vars.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 2022
          concurrency: 5
          uploads: |
            ./ => ./upload

  report:
    name: Report
    if: always()
    continue-on-error: true
    needs:
      - publish
    env:
      SUCCESS: ${{ needs.publish.result == 'success' }}
    steps:
      - name: Notify User
        uses: https://${{ vars.LOCAL_REGISTRY_URL }}/${{ vars.LOCAL_REGISTRY_USERNAME }}/gitea-workflows-notification@main
        with:
          success: ${{ env.SUCCESS }}
          pushover_user: ${{ secrets.PUSHOVER_USER }}
          pushover_token: ${{ secrets.PUSHOVER_TOKEN }}
